<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap practice</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container-fluid bg-dark p-5 text-white">

    <div class="d-flex justify-content-between fs-5">
      <a href="tel:+12345678910" class="text-decoration-none" >
        <span class="bi bi-telephone-fill text-warning"></span>
        <span class="text-white"> +12345678910</span>
      </a>
      <button class="btn btn-link text-white p-0 border-0" type="button" 
        data-bs-toggle="offcanvas" data-bs-target="#sidebarmenu"
        aria-controls="Sidebarmenu" aria-label="open menu"> 
        <span class="bi bi-list fs-3 "></span>
      </button>
    </div>

    <div class="offcanvas offcanvas-start text-bg-dark"
      id="sidebarmenu" aria-labelledby="sidebarMenuLabel">

      <div class="d-flex justify-content-end p-2">
        <button type="button" class="btn-close btn-close-white" 
        data-bs-dismiss="offcanvas" aria-label="Close">
        </button>
      </div>

      <div class="offcanvas-body text-center">
        <ul class="navbar-nav fs-5">
          <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="#">About us</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Contact us</a></li>
        </ul>
      </div>

    </div>

    
     
    <div class="pt-5 text-white">
      <h1 class="display-2 fw-bold hero-heading">Building digital products & brands.</h1>
      <p class="pt-2">
        Deliver great service experiences fast - without the complexity of traditional ITSM solutions. Accelerate critical development work, eliminate toil, and deploy changes with ease.
      </p>
    </div>
    
    <div class="pt-4 text-white">
      <p>image from <a href="https://freepik.com" target="blank" class="image-credit">freepik</a></p>
    </div>

    <div>
      <button type="button" class="custom-btn1 me-4">About us</button>
      <button type="button" class="custom-btn2">Contact us</button>
    </div>

    <div class="my-5 img-container">
      <img src="https://assets.nicepagecdn.com/11a8ddce/6197189/images/22678076_IconBusinessv3_5_.png" class="img-fluid" alt="3d kite">
    </div>
      
  </div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

  <script src="script.js"></script>
</body>
</html>
